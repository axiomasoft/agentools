name: agentools
description: Dart contracts and validators for the AgenTools protocol.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.6
  json_schema: ^5.2.2
  # Older transitive releases use BidirectionalIterator removed from Dart 3.
  quiver: ^3.2.1
  ulid: ^2.0.1

dev_dependencies:
  # v3 targets the removed JIT frontend snapshot; lowest graphs need the AOT client.
  frontend_server_client: ^4.0.0
  benchmark_harness: 2.4.0
  test: ^1.31.0
  lints: ^6.1.0
  postgres: ^3.6.0

agentools:
  spec_rev: 2026-09
  declared_level: L3
