title = "agentools gitleaks policy (P9.1)"
minVersion = "8.25.0"

[extend]
useDefault = true

[[allowlists]]
description = "Published non-secret confirmation token examples"
regexes = [
  '''^at1\.eyJ2IjoxfQ\.Zm9vYmFy$''',
  '''^at_ct_9f8b1c2d4e6a8c0f2b4d6e8a0c2e4f60$''',
]

[[allowlists]]
description = "Generated successor revision lock integrity digests with secret-like fixture names"
condition = "AND"
paths = ['''^spec/revisions/2026-09/revision\.lock\.json$''']
regexTarget = "match"
regexes = [
  '''^(?:duplicate-keys\.(?:error|input|meta)|token-replay-v1|conftoken-[0-9]+)\.json\"?: \"[0-9a-f]{64}\"$''',
]

[[allowlists]]
description = "Generated adversarial manifest digest for the token-replay carrier"
condition = "AND"
paths = ['''^fixtures/hardening/adversarial/manifest\.v1\.json$''']
regexTarget = "match"
regexes = ['''^token_replay\":\"[0-9a-f]{64}\"$''']

[redact]
description = "Never print matched secret material in CI logs"
redact = 100

[[allowlists]]
description = "Migration journal SHA-256 entries for three documented files; exact value shape and path only"
condition = "AND"
paths = ['''^plans/2026\.09\.19-№1-AGENTOOLS-HARDENING/log\.jsonl$''']
regexTarget = "match"
regexes = ['''^(?:P3-token-migration|P7-api-inventory|token-replay-v1)\.md\"?:\s*\"[0-9a-f]{64}\"$''']

[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "Documented Botkit Planner API revision SHA-256 digest in bootstrap inventory"
condition = "AND"
paths = ['''^docs/platform/bootstrap\.json$''']
regexTarget = "match"
regexes = ['''^API revision sha256:efa41e9a05831f44943c5293e3e4041fe5af6d17117d82377e54475a9abd4ba2\"$''']
