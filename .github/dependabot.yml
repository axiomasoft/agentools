version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Every action bump must also update .ci/supply-chain-lock.json (SC-LOCK-002),
    # so batch them into one PR that gets a single lock sync.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - supply-chain
  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: composer
    directory: /conformance
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: pub
    directory: /dart/agentools
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: pub
    directory: /dart/agentools_mcp_dart
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /conformance/mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
