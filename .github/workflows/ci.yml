name: conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --working-dir=conformance --no-interaction --prefer-dist
      - run: python3 tools/ci_gate.py --layer 1
      - run: python3 tools/ci_gate.py --layer 2
      - run: python3 tools/ci_gate.py --layer 3
      - run: python3 tools/ci_gate.py --layer 4
