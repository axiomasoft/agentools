name: private-rc

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: private-rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Trusted ref guard
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"

  assemble:
    needs: trusted-ref
    if: needs.trusted-ref.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: agentools
          POSTGRES_PASSWORD: agentools-test
          POSTGRES_DB: agentools_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentools -d agentools_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTOOLS_TEST_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=agentools_test
      AGENTOOLS_TEST_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.13.4"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: conformance/mcp/package-lock.json
      - name: Install locked dependencies
        run: |
          composer install --working-dir=php --no-interaction --prefer-dist
          composer install --working-dir=conformance --no-interaction --prefer-dist
          npm ci --ignore-scripts --prefix conformance/mcp
          conformance/mcp/node_modules/.bin/conformance --version
          (cd dart/agentools && dart pub get)
          (cd dart/agentools_mcp_dart && dart pub get)
      - name: Supply-chain policy
        run: |
          python3 tools/ci_policy.py check-lock
          python3 tools/ci_policy.py check-workflows
          python3 tools/ci_matrix.py validate
      - name: P8 release-candidate tier workloads
        run: |
          python3 tools/ci_gate.py --all
          conformance/bin/semantic-parity
          python3 tools/adversarial_corpus.py run
          python3 tools/mutation_gate.py run
          python3 tools/resource_gate.py run
          python3 tools/ci_matrix.py emit
      - name: Private RC subjects and supply-chain evidence
        run: |
          python3 tools/release_candidate.py run
          python3 tools/sbom_gate.py run
      - name: Aggregate verification receipt
        run: python3 tools/private_rc_gate.py run
      - name: Upload RC evidence bundle (transport only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-rc-evidence
          path: |
            plans/2026.09.19-№1-AGENTOOLS-HARDENING/artifacts/P9-private-rc.json
            plans/2026.09.19-№1-AGENTOOLS-HARDENING/artifacts/P9-reproducibility.json
            plans/2026.09.19-№1-AGENTOOLS-HARDENING/artifacts/P9-supply-chain-evidence.json
          retention-days: 7
          if-no-files-found: error
