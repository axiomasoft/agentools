name: private-rc

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: private-rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Trusted ref guard
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"

  assemble:
    needs: trusted-ref
    if: needs.trusted-ref.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      AGENTOOLS_TEST_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.13.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: conformance/mcp/package-lock.json
      - name: Install all verification dependencies
        run: bash scripts/ci-bootstrap.sh
      - name: Isolated PostgreSQL test database
        run: bash scripts/ci-postgres.sh
      - name: Supply-chain policy
        run: |
          python3 tools/ci_policy.py check-lock
          python3 tools/ci_policy.py check-workflows
          python3 tools/ci_matrix.py validate
      - name: P8 release-candidate tier workloads
        run: |
          python3 tools/ci_gate.py --all
          conformance/bin/semantic-parity
          python3 tools/adversarial_corpus.py run
          python3 tools/mutation_gate.py run
          python3 tools/storage_chaos.py run
          python3 tools/resource_gate.py run
          python3 tools/ci_matrix.py emit
      - name: Private RC subjects and supply-chain evidence
        run: |
          python3 tools/release_candidate.py run
          python3 tools/sbom_gate.py run
      - name: Aggregate verification receipt
        run: python3 tools/private_rc_gate.py run
      - name: Upload RC evidence bundle (transport only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-rc-evidence
          path: |
            verification/artifacts/P9-private-rc.json
            verification/artifacts/P9-reproducibility.json
            verification/artifacts/P9-supply-chain-evidence.json
          retention-days: 7
          if-no-files-found: error
