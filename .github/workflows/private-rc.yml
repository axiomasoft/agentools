name: private-rc

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: private-rc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Trusted ref guard
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"

  assemble:
    needs: trusted-ref
    if: needs.trusted-ref.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.13.4"
      - name: Supply-chain policy
        run: |
          python3 tools/ci_policy.py check-lock
          python3 tools/ci_policy.py check-workflows
          python3 tools/ci_matrix.py validate
      - name: P8 release-candidate tier workloads
        run: |
          python3 tools/ci_gate.py --all
          conformance/bin/semantic-parity
          python3 tools/adversarial_corpus.py run
          python3 tools/mutation_gate.py run
          python3 tools/resource_gate.py run
      - name: Private RC subjects and supply-chain evidence
        run: |
          python3 tools/release_candidate.py run
          python3 tools/sbom_gate.py run
      - name: Aggregate verification receipt
        run: python3 tools/private_rc_gate.py run
      - name: Upload RC evidence bundle (transport only)
        uses: actions/upload-artifact@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          name: private-rc-evidence
          path: |
            plans/2026.09.19-№1-AGENTOOLS-HARDENING/artifacts/P9-private-rc.json
            plans/2026.09.19-№1-AGENTOOLS-HARDENING/artifacts/P9-reproducibility.json
            plans/2026.09.19-№1-AGENTOOLS-HARDENING/artifacts/P9-supply-chain-evidence.json
          retention-days: 7
          if-no-files-found: error

  hosted-attest:
    needs: assemble
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Conditional GitHub attestation (capability unavailable-plan)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: plans/2026.09.19-№1-AGENTOOLS-HARDENING/artifacts/P9-reproducibility.json
